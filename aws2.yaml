  claudesonnet46_global: &claudesonnet46_global { model: "global.anthropic.claude-sonnet-4-6", cost: *cost }
  gpt6astra_us: &gpt6astra_us { model: "us.openai.gpt-6-astra", cost: *cost }
  gpt6astra_global: &gpt6astra_global { model: "global.openai.gpt-6-astra", cost: *cost }

