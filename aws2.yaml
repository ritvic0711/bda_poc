  claudeopus46_global: &claudeopus46_global { model: "global.anthropic.claude-opus-4-6-v1", cost: *cost }
  claudefable51_us: &claudefable51_us { model: "us.anthropic.claude-fable-5-1", cost: *cost }
  claudefable51_global: &claudefable51_global { model: "global.anthropic.claude-fable-5-1", cost: *cost }
