# =============================================================================
# configs/aws.yaml  — all AWS accounts (dev, qa) in one file. PURE CONFIG.
# =============================================================================
# Selector is the ACCOUNT (environment): --vendor aws --env dev|qa  (or "dev,qa").
#
# Per-model axis is the INFERENCE PROFILE: us.<id> vs global.<id>. Each
# (model, profile) is ONE catalog anchor (full model id + cost), shared by every
# environment. Each env's wiring line pairs a catalog anchor with that account.
#
# Per-account creds come from env vars (temporary STS creds): set
#   AWS_DEV_ACCESS_KEY_ID / AWS_DEV_SECRET_ACCESS_KEY / AWS_DEV_SESSION_TOKEN
#   AWS_QA_ACCESS_KEY_ID  / AWS_QA_SECRET_ACCESS_KEY  / AWS_QA_SESSION_TOKEN
#
# MERGE: <<: [*a, *b, ...] — FIRST anchor wins on key clash; a key on the line
# itself beats all anchors. Sequence form only (PyYAML rejects two '<<').
# =============================================================================

vendor: aws

test_settings:
  structured_instruction: |
    Do not wrap inside custom syntax blocks outside valid JSON notation arrays.

_base: &base { provider: aws, streaming: true, temperature: 0 }

# ---- access methods (NO region, NO model id here) ----
_runtime: &runtime
  <<: [*base]
  model_type: bedrock_runtime
  model_provider: bedrock_converse
_mantle: &mantle
  <<: [*base]
  model_type: bedrock_mantle
  model_provider: openai
  auth_method: bedrock_mantle_iam     # handler injects api_key (IAM token) + base_url

# ---- per-account creds (STS temporary creds via env vars) ----
_accounts:
  dev: &acc_dev
    region_name: "us-east-1"
    aws_access_key_id: "${AWS_DEV_ACCESS_KEY_ID}"
    aws_secret_access_key: "${AWS_DEV_SECRET_ACCESS_KEY}"
    aws_session_token: "${AWS_DEV_SESSION_TOKEN}"
  qa: &acc_qa
    region_name: "us-east-1"
    aws_access_key_id: "${AWS_QA_ACCESS_KEY_ID}"
    aws_secret_access_key: "${AWS_QA_SECRET_ACCESS_KEY}"
    aws_session_token: "${AWS_QA_SESSION_TOKEN}"

# ---- cost shared by all (override per catalog entry if a model differs) ----
_cost: &cost { input_per_1m: 0.70, output_per_1m: 0.60 }

# ---- catalog: one anchor per (model, profile), full model id + cost ----
_catalog:
  claude3sonnet20240229_us: &claude3sonnet20240229_us { model: "us.anthropic.claude-3-sonnet-20240229-v1:0", cost: *cost }
  claude3haiku20240307_us: &claude3haiku20240307_us { model: "us.anthropic.claude-3-haiku-20240307-v1:0", cost: *cost }
  claudeopus41_us: &claudeopus41_us { model: "us.anthropic.claude-opus-4-1-20250805-v1:0", cost: *cost }
  claudeopus45_us: &claudeopus45_us { model: "us.anthropic.claude-opus-4-5-20251101-v1:0", cost: *cost }
  claudeopus45_global: &claudeopus45_global { model: "global.anthropic.claude-opus-4-5-20251101-v1:0", cost: *cost }
  claudeopus47_us: &claudeopus47_us { model: "us.anthropic.claude-opus-4-7", cost: *cost }
  claudeopus47_global: &claudeopus47_global { model: "global.anthropic.claude-opus-4-7", cost: *cost }
  claudesonnet45_us: &claudesonnet45_us { model: "us.anthropic.claude-sonnet-4-5-20250929-v1:0", cost: *cost }
  claudesonnet45_global: &claudesonnet45_global { model: "global.anthropic.claude-sonnet-4-5-20250929-v1:0", cost: *cost }
  claudesonnet4_us: &claudesonnet4_us { model: "us.anthropic.claude-sonnet-4-20250514-v1:0", cost: *cost }
  claudesonnet4_global: &claudesonnet4_global { model: "global.anthropic.claude-sonnet-4-20250514-v1:0", cost: *cost }
  claudeopus48_us: &claudeopus48_us { model: "us.anthropic.claude-opus-4-8", cost: *cost }
  claudeopus48_global: &claudeopus48_global { model: "global.anthropic.claude-opus-4-8", cost: *cost }
  claudefable5_us: &claudefable5_us { model: "us.anthropic.claude-fable-5", cost: *cost }
  claudefable5_global: &claudefable5_global { model: "global.anthropic.claude-fable-5", cost: *cost }
  claudesonnet5_us: &claudesonnet5_us { model: "us.anthropic.claude-sonnet-5", cost: *cost }
  claudesonnet5_global: &claudesonnet5_global { model: "global.anthropic.claude-sonnet-5", cost: *cost }
