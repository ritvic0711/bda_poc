  azure_o3minigs: &azure_o3minigs
    <<: *base_legacy
    <<: *stream_temp
    model: "o3-mini"                      # TODO confirm real deployment id
    cost: { input_per_1m: 0.15, output_per_1m: 0.6 }

  azure_o3: &azure_o3
    <<: *base_legacy
    <<: *stream_temp
    model: "o3"                           # TODO
    cost: { input_per_1m: 2.00, output_per_1m: 8.00 }

  azure_o4mini: &azure_o4mini
