# =============================================================================
# environments — wiring only. Each line: <<: [*model, *endpoint], name (+ suffix
# for legacy embeddings). qa and dev differ ONLY in the *ep_* token.
# =============================================================================
environments:

  qa:
    models:
      # Legacy (embeddings carry a per-model path suffix on the qa legacy host)
      - { <<: [*azure_textembeddingada002, *ep_qa_legacy], base_url: "${AZURE_QA_LEGACY_URL}/text-embedding-ada-002", name: "Azure_TextEmbeddingAda002" }
      - { <<: [*azure_textembedding3small, *ep_qa_legacy], base_url: "${AZURE_QA_LEGACY_URL}/text-embedding-3-small", name: "Azure_TextEmbedding3Small" }
      - { <<: [*azure_o3minigs,            *ep_qa_legacy], name: "Azure_O3MiniGs" }
      - { <<: [*azure_o3,                  *ep_qa_legacy], name: "Azure_O3" }
      - { <<: [*azure_o4mini,              *ep_qa_legacy], name: "Azure_O4Mini" }
      - { <<: [*azure_gpt41,               *ep_qa_legacy], name: "Azure_Gpt41" }
      - { <<: [*azure_gpt41minizptu,       *ep_qa_legacy], name: "Azure_Gpt41MiniZptu" }
      - { <<: [*azure_gpt5zstd,            *ep_qa_legacy], name: "Azure_Gpt5Zstd" }
      - { <<: [*azure_gpt5gs,              *ep_qa_legacy], name: "Azure_Gpt5Gs" }
      - { <<: [*azure_gpt5nanozstd,        *ep_qa_legacy], name: "Azure_Gpt5NanoZstd" }
      - { <<: [*azure_gpt5nanogs,          *ep_qa_legacy], name: "Azure_Gpt5NanoGs" }
      - { <<: [*azure_gpt4omini20240718zstd, *ep_qa_legacy], name: "Azure_Gpt4oMini20240718Zstd" }
      - { <<: [*azure_gpt41zstd,           *ep_qa_legacy], name: "Azure_Gpt41Zstd" }
      # APIM
      - { <<: [*azure_textembedding3large, *ep_qa_apim], name: "Azure_TextEmbedding3Large" }
      - { <<: [*azure_gpt5minizstd,        *ep_qa_apim], name: "Azure_Gpt5MiniZstd" }
      - { <<: [*azure_gpt5minigs,          *ep_qa_apim], name: "Azure_Gpt5MiniGs" }
      - { <<: [*azure_gpt5minizptu,        *ep_qa_apim], name: "Azure_Gpt5MiniZptu" }
      - { <<: [*azure_gpt51,               *ep_qa_apim], name: "Azure_Gpt51" }
      - { <<: [*azure_gpt52,               *ep_qa_apim], name: "Azure_Gpt52" }
      - { <<: [*azure_gpt54,               *ep_qa_apim], name: "Azure_Gpt54" }
      - { <<: [*azure_gpt54minigs,         *ep_qa_apim], name: "Azure_Gpt54MiniGs" }
      - { <<: [*azure_gpt54minizstd,       *ep_qa_apim], name: "Azure_Gpt54MiniZstd" }
      - { <<: [*azure_gpt54nano,           *ep_qa_apim], name: "Azure_Gpt54Nano" }
      - { <<: [*azure_gpt53codex,          *ep_qa_apim], name: "Azure_Gpt53Codex" }
      - { <<: [*azure_gpt55zstd,           *ep_qa_apim], name: "Azure_Gpt55Zstd" }
      - { <<: [*azure_gpt55gs,             *ep_qa_apim], name: "Azure_Gpt55Gs" }
      - { <<: [*azure_gpt56lunazstd,       *ep_qa_apim], name: "Azure_Gpt56LunaZstd" }
      - { <<: [*azure_gpt56solzstd,        *ep_qa_apim], name: "Azure_Gpt56SolZstd" }
      - { <<: [*azure_gpt56terrazstd,      *ep_qa_apim], name: "Azure_Gpt56TerraZstd" }

  dev:
    models:
      # Legacy
      - { <<: [*azure_textembeddingada002, *ep_dev_legacy], base_url: "${AZURE_DEV_LEGACY_URL}/text-embedding-ada-002", name: "Azure_TextEmbeddingAda002" }
      - { <<: [*azure_textembedding3small, *ep_dev_legacy], base_url: "${AZURE_DEV_LEGACY_URL}/text-embedding-3-small", name: "Azure_TextEmbedding3Small" }
