    <<: *stream_temp
    model: "text-embedding-ada-002"
    cost: { input_per_1m: 0.15, output_per_1m: 0.6 }

  azure_textembedding3small: &azure_textembedding3small
    <<: *base_legacy
    <<: *stream_temp
    model: "text-embedding-3-small"
