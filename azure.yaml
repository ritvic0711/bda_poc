# =============================================================================
# configs/azure.yaml  — all Azure environments in one file
# =============================================================================
# Layering that keeps it DRY across many models AND across environments:
#   _base / _stream_temp   shared scaffolding (provider, type, sampling)
#   _base_apim / _base_legacy   auth/header FLAVOUR — NO url, NO key
#   _catalog               each model defined ONCE — model id + cost, NO endpoint
#   _endpoints             per-env url + key, defined ONCE each (qa vs dev differ here)
#   environments           wiring: <<: [*model, *endpoint] + name
#
# MERGE RULE (important): in `<<: [*a, *b]` the FIRST anchor wins on key clash,
# and keys written directly in the mapping beat both. Catalog anchors carry NO
# base_url/api_key, so the endpoint anchor supplies them cleanly. If you ever
# put base_url back in a catalog anchor, the endpoint won't override it and dev
# will silently hit the qa host — don't.
# =============================================================================

vendor: azure

# ---- shared scaffolding ----
_base: &base
  provider: "azure"
  model_type: "azure_openai"
  model_provider: "openai"

_stream_temp: &stream_temp
  streaming: true
  temperature: 0

# ---- auth flavours (NO url / NO key here) ----
_base_legacy: &base_legacy
  <<: *base
  default_query:
    api-version: "20252006"
  default_headers:
    Ocp-Apim-Subscription-Key: "${AZURE_SUBSCRIPTION_KEY}"
    Content-Type: "application/json"

_base_apim: &base_apim
  <<: *base
  use_responses_api: true
  store: false

_apim_headers: &apim_headers
  Content-Type: "application/json"
  Ocp-Apim-Subscription-Key: "${AZURE_SUBSCRIPTION_KEY}"

# =============================================================================
# _endpoints — the ONLY place qa and dev differ. Fill in your real env-var names.
# Two flavours per env because legacy and APIM sit behind different hosts/keys.
# =============================================================================
_endpoints:
  qa_legacy:  &ep_qa_legacy  { base_url: "${AZURE_QA_LEGACY_URL}",   api_key: "${AZURE_QA_OPENAI_API_KEY}" }
  qa_apim:    &ep_qa_apim    { base_url: "${AZURE_QA_APIM_HOST_URL}", api_key: "${AZURE_QA_API_KEY}" }
  dev_legacy: &ep_dev_legacy { base_url: "${AZURE_DEV_LEGACY_URL}",   api_key: "${AZURE_DEV_OPENAI_API_KEY}" }
  dev_apim:   &ep_dev_apim   { base_url: "${AZURE_DEV_APIM_HOST_URL}", api_key: "${AZURE_DEV_API_KEY}" }

# =============================================================================
# _catalog — every model defined ONCE. Endpoint-free.
# NOTE: `model:` values below are PLACEHOLDERS reconstructed from screenshots —
# replace each with your real deployment/model string before running.
# Legacy embedding models need a per-model path suffix on base_url; that suffix
# is applied in the wiring lines (see qa/dev), not here.
# =============================================================================
_catalog:

  # ---- Legacy deployment models ----
  azure_textembeddingada002: &azure_textembeddingada002
