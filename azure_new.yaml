# =============================================================================
# configs/azure.yaml  — all Azure environments in one file
# =============================================================================
# Layering:
#   _base / _stream_temp        shared scaffolding (provider, type, sampling)
#   _base_apim / _base_legacy   auth FLAVOUR — NO url, NO key, NO headers
#   _catalog                    each model ONCE — model id + cost, NO endpoint, NO headers
#   _endpoints                  per-env url + key + HEADERS (qa vs dev differ here)
#   environments                wiring: <<: [*model, *endpoint] + name
#
# MERGE RULE: in `<<: [*a, *b]` the FIRST anchor wins on key clash; keys written
# directly in the mapping beat both. Therefore a catalog anchor must carry NO
# base_url / api_key / default_headers — otherwise it beats the endpoint and the
# per-env value is silently ignored. (This is why APIM models here have NO
# `default_headers: *apim_headers` line — that line defeated the per-env headers.)
# =============================================================================

vendor: azure

# ---- shared scaffolding ----
_base: &base
  provider: "azure"
  model_type: "azure_openai"
  model_provider: "openai"

_stream_temp: &stream_temp
  streaming: true
  temperature: 0

# ---- auth flavours (NO url / NO key / NO headers) ----
_base_legacy: &base_legacy
  <<: *base
  default_query:
    api-version: "20252006"

_base_apim: &base_apim
  <<: *base
  use_responses_api: true
  store: false

# =============================================================================
# _endpoints — the ONLY place qa and dev differ: url + key + headers (incl. the
# per-env subscription key). Four anchors = env x flavour, so you can vary
# headers per environment AND per flavour independently.
# =============================================================================
_endpoints:
  qa_legacy: &ep_qa_legacy
    base_url: "${AZURE_QA_LEGACY_URL}"
    api_key: "${AZURE_QA_OPENAI_API_KEY}"
    default_headers:
      Content-Type: "application/json"
      Ocp-Apim-Subscription-Key: "${AZURE_QA_SUBSCRIPTION_KEY}"

  qa_apim: &ep_qa_apim
    base_url: "${AZURE_QA_APIM_HOST_URL}"
    api_key: "${AZURE_QA_API_KEY}"
    default_headers:
      Content-Type: "application/json"
      Ocp-Apim-Subscription-Key: "${AZURE_QA_SUBSCRIPTION_KEY}"

  dev_legacy: &ep_dev_legacy
    base_url: "${AZURE_DEV_LEGACY_URL}"
    api_key: "${AZURE_DEV_OPENAI_API_KEY}"
    default_headers:
      Content-Type: "application/json"
      Ocp-Apim-Subscription-Key: "${AZURE_DEV_SUBSCRIPTION_KEY}"

  dev_apim: &ep_dev_apim
    base_url: "${AZURE_DEV_APIM_HOST_URL}"
    api_key: "${AZURE_DEV_API_KEY}"
    default_headers:
      Content-Type: "application/json"
      Ocp-Apim-Subscription-Key: "${AZURE_DEV_SUBSCRIPTION_KEY}"

# =============================================================================
# _catalog — every model defined ONCE. Endpoint-free, header-free.
# Replace any # TODO model string with your real deployment id before running.
