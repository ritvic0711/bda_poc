  azure_o4mini: &azure_o4mini { <<: [*base_legacy, *stream_temp], model: "o4-mini", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
  azure_gpt41: &azure_gpt41 { <<: [*base_legacy, *stream_temp], model: "gpt-4.1", cost: { input_per_1m: 2.0, output_per_1m: 8.0 } }
  azure_gpt41minizptu: &azure_gpt41minizptu { <<: [*base_legacy, *stream_temp], model: "gpt-4.1-mini", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
  azure_gpt5zstd: &azure_gpt5zstd { <<: [*base_legacy, *stream_temp], model: "gpt-5", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt5gs: &azure_gpt5gs { <<: [*base_legacy, *stream_temp], model: "gpt-5", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt5nanozstd: &azure_gpt5nanozstd { <<: [*base_legacy, *stream_temp], model: "gpt-5-nano", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt5nanogs: &azure_gpt5nanogs { <<: [*base_legacy, *stream_temp], model: "gpt-5-nano", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt4omini20240718zstd: &azure_gpt4omini20240718zstd { <<: [*base_legacy, *stream_temp], model: "gpt-4o-mini-2024-07-18", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
  azure_gpt41zstd: &azure_gpt41zstd { <<: [*base_legacy, *stream_temp], model: "gpt-4.1", cost: { input_per_1m: 2.0, output_per_1m: 8.0 } }
  azure_textembedding3large: &azure_textembedding3large { <<: [*base_apim, *stream_temp], model: "text-embedding-3-large", cost: { input_per_1m: 0.13, output_per_1m: 0 } }
  azure_gpt5minizstd: &azure_gpt5minizstd { <<: [*base_apim, *stream_temp], model: "gpt-5-mini", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt5minigs: &azure_gpt5minigs { <<: [*base_apim, *stream_temp], model: "gpt-5-mini", cost: { input_per_1m: 0, output_per_1m: 0 } }
