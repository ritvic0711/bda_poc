  azure_gpt55zstd: &azure_gpt55zstd { <<: [*base_apim, *stream_temp], model: "gpt-5.5", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt55gs: &azure_gpt55gs { <<: [*base_apim, *stream_temp], model: "gpt-5.5", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt56lunazstd: &azure_gpt56lunazstd { <<: [*base_apim, *stream_temp], model: "gpt-5.6-luna", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
