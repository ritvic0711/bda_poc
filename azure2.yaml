  azure_gpt52: &azure_gpt52 { <<: [*base_apim, *stream_temp], model: "gpt-5.2", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt54: &azure_gpt54 { <<: [*base_apim, *stream_temp], model: "gpt-5.4", cost: { input_per_1m: 0, output_per_1m: 0 } }
  azure_gpt54minigs: &azure_gpt54minigs { <<: [*base_apim, *stream_temp], model: "gpt-5.4", cost: { input_per_1m: 0, output_per_1m: 0 } }
