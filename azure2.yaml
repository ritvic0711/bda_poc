# =============================================================================
# configs/<env>/azure.yaml  — PURE CONFIG. No Python resolves anything.
# =============================================================================
# _catalog   : each model defined ONCE (model id + cost). No endpoint, no headers.
# _endpoints : per-env url + key, ONCE each.
# _headers   : per-env Content-Type + subscription key, ONCE each.
# environments: wiring. APIM lines carry Openai-model + Openai-model-version
#   inline, merged with the per-env header anchor via  <<: [*hdr_<env>] .
# yaml.safe_load resolves every merge; default_headers reaches init_chat_model
# complete. PyYAML needs the SEQUENCE merge form  <<: [*a, *b]  in flow maps.
# Replace # TODO model strings + Openai-model-version with real values.
# =============================================================================

vendor: azure

_base: &base { provider: azure, model_type: azure_openai, model_provider: openai }
_stream_temp: &stream_temp { streaming: true, temperature: 0 }
_base_apim: &base_apim { <<: [*base], use_responses_api: true, store: false }
_base_legacy: &base_legacy { <<: [*base], default_query: { api-version: "20252006" } }

_endpoints:
  qa_apim: &ep_qa_apim       { base_url: "${AZURE_QA_APIM_HOST_URL}",  api_key: "${AZURE_QA_API_KEY}" }
  qa_legacy: &ep_qa_legacy   { base_url: "${AZURE_QA_LEGACY_URL}",     api_key: "${AZURE_QA_OPENAI_API_KEY}" }
  dev_apim: &ep_dev_apim     { base_url: "${AZURE_DEV_APIM_HOST_URL}", api_key: "${AZURE_DEV_API_KEY}" }
  dev_legacy: &ep_dev_legacy { base_url: "${AZURE_DEV_LEGACY_URL}",    api_key: "${AZURE_DEV_OPENAI_API_KEY}" }

_headers:
  qa: &hdr_qa   { Content-Type: "application/json", Ocp-Apim-Subscription-Key: "${AZURE_QA_SUBSCRIPTION_KEY}" }
  dev: &hdr_dev { Content-Type: "application/json", Ocp-Apim-Subscription-Key: "${AZURE_DEV_SUBSCRIPTION_KEY}" }

_catalog:
  azure_textembeddingada002: &azure_textembeddingada002 { <<: [*base_legacy, *stream_temp], model: "text-embedding-ada-002", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
  azure_textembedding3small: &azure_textembedding3small { <<: [*base_legacy, *stream_temp], model: "text-embedding-3-small", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
  azure_o3minigs: &azure_o3minigs { <<: [*base_legacy, *stream_temp], model: "o3-mini", cost: { input_per_1m: 0.15, output_per_1m: 0.6 } }
